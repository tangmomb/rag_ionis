name: Deploy Scaleway GPU - Container registry

on:
  push:
    branches: [master]
    paths:
      - ".dockerignore"
      - "Dockerfile.scaleway"
      - "requirements-gpu.txt"
      - "requirements-paddle-bootstrap.txt"
      - "requirements-ytdlp.txt"
      - "models/frame_filter_2026-07-02_21-30-31.joblib"
      - "pipeline/**"
      - ".github/workflows/deploy-scaleway.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scaleway-gpu-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run Scaleway configuration tests
        run: python -m unittest tests.test_scaleway_configuration tests.test_scaleway_command_builder

      - name: Validate Scaleway shell scripts
        shell: bash
        run: bash -n deploy/publish-image.sh deploy/publish-scaleway-image.sh deploy/deploy-scaleway-worker.sh

  build:
    needs: validate
    runs-on: [self-hosted, Windows, X64, gpu-image-builder]
    environment: production-scaleway
    steps:
      - uses: actions/checkout@v5
      - name: Validate registry configuration
        # Use the native Windows shell: bash can resolve to the WSL launcher.
        shell: powershell
        env:
          REGISTRY_NAMESPACE: ${{ vars.SCW_REGISTRY_NAMESPACE }}
          REGISTRY_PASSWORD: ${{ secrets.SCW_REGISTRY_PASSWORD || secrets.SCW_SECRET_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:REGISTRY_NAMESPACE)) {
            throw 'Missing repository variable SCW_REGISTRY_NAMESPACE'
          }
          if ([string]::IsNullOrWhiteSpace($env:REGISTRY_PASSWORD)) {
            throw 'Missing secret SCW_REGISTRY_PASSWORD or SCW_SECRET_KEY'
          }
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.SCW_REGISTRY_NAMESPACE }}
          username: nologin
          password: ${{ secrets.SCW_REGISTRY_PASSWORD || secrets.SCW_SECRET_KEY }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.scaleway
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.SCW_REGISTRY_NAMESPACE }}/rag-ionis-scaleway:${{ github.sha }}
            ${{ vars.SCW_REGISTRY_NAMESPACE }}/rag-ionis-scaleway:latest
          cache-from: type=registry,ref=${{ vars.SCW_REGISTRY_NAMESPACE }}/rag-ionis-scaleway:buildcache
          cache-to: type=registry,ref=${{ vars.SCW_REGISTRY_NAMESPACE }}/rag-ionis-scaleway:buildcache,mode=min
