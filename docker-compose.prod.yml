# Surcharges de production. A utiliser avec docker-compose.yml.
services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ANALYTICS_DATABASE_PASSWORD: ${ANALYTICS_DATABASE_PASSWORD:?ANALYTICS_DATABASE_PASSWORD is required}
      TZ: Europe/Paris
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ${CONTAINER_REGISTRY:?CONTAINER_REGISTRY is required}/rag-ionis-api:${API_IMAGE_TAG:?API_IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      RAG_IONIS_ENV: production
      RAG_IONIS_ENV_FILE_OPTIONAL: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ANALYTICS_DATABASE_URL: postgresql://rag_ionis_analytics:${ANALYTICS_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ANALYTICS_MAX_TOTAL_COST: ${ANALYTICS_MAX_TOTAL_COST:-100000}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?GOOGLE_API_KEY is required}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:?MISTRAL_API_KEY is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      COHERE_API_KEY: ${COHERE_API_KEY:?COHERE_API_KEY is required}
      OPENAI_SERVICE_TIER: ${OPENAI_SERVICE_TIER:-fast}
      PUBLIC_ORIGINS: https://${APP_DOMAIN}
      PHOENIX_ENABLED: "true"
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
      PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-rag-ionis}
    expose:
      - "8006"
    depends_on:
      postgres:
        condition: service_healthy
      phoenix:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # Commande ponctuelle, absente de `up -d` grace au profil jobs :
  # docker compose ... --profile jobs run --rm updater
  updater:
    profiles: ["jobs"]
    image: ${CONTAINER_REGISTRY:?CONTAINER_REGISTRY is required}/rag-ionis-updater:${UPDATER_IMAGE_TAG:?UPDATER_IMAGE_TAG is required}
    environment:
      RAG_IONIS_ENV: production
      RAG_IONIS_ENV_FILE_OPTIONAL: "1"
      PIPELINE_EXECUTION_BACKEND: scaleway
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:?YOUTUBE_API_KEY is required}
      SCW_SECRET_KEY: ${SCW_SECRET_KEY:?SCW_SECRET_KEY is required}
      SCW_DEFAULT_PROJECT_ID: ${SCW_DEFAULT_PROJECT_ID:?SCW_DEFAULT_PROJECT_ID is required}
      SCW_DEFAULT_ZONE: ${SCW_DEFAULT_ZONE:-fr-par-2}
      SCALEWAY_SERVER_ID: ${SCALEWAY_SERVER_ID:?SCALEWAY_SERVER_ID is required}
      SCALEWAY_INSTANCE_TYPE: ${SCALEWAY_INSTANCE_TYPE:-L4-1-24G}
      SCALEWAY_POLL_SECONDS: ${SCALEWAY_POLL_SECONDS:-10}
      SCALEWAY_JOB_TIMEOUT_SECONDS: ${SCALEWAY_JOB_TIMEOUT_SECONDS:-21600}
      SCALEWAY_MAX_CONCURRENT_JOBS: "1"
      SCALEWAY_S3_JOB_PREFIX: ${SCALEWAY_S3_JOB_PREFIX:-scaleway/jobs}
      SCALEWAY_STOP_AFTER_JOB: ${SCALEWAY_STOP_AFTER_JOB:-1}
      SCALEWAY_KEEP_JOB_ARTIFACTS: ${SCALEWAY_KEEP_JOB_ARTIFACTS:-0}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
      S3_REGION: ${S3_REGION:?S3_REGION is required}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  phoenix:
    volumes:
      - phoenix_data:/mnt/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    name: rag_ionis_postgres_data
  phoenix_data:
    name: rag_ionis_phoenix_data
  caddy_data:
    name: rag_ionis_caddy_data
  caddy_config:
    name: rag_ionis_caddy_config
