# Surcharges de production. A utiliser avec docker-compose.yml.
# Le VPS (7,8 Gio, 4 vCPU) heberge aussi le projet agent_mots_cles (systemd, hors Docker).
# Plafonds RAM stricts (memswap_limit = mem_limit : pas de swap en plus) : prod 2,25 Gio,
# staging 1,5 Gio, updater 1 Gio, soit 4,75 Gio au pire.
# Priorite au RAG de prod : l'API et PostgreSQL de prod ont une reserve (mem_reservation,
# memory.low) que le noyau recupere en dernier, et oom_score_adj -500 pour etre tues en
# dernier. Phoenix, le staging et l'updater cedent avant le projet agent (oom_score_adj > 0).
# La reserve n'agit que si system.slice (parent des conteneurs) a elle aussi un MemoryLow,
# a regler une fois sur l'hote : sudo systemctl set-property system.slice MemoryLow=1152M
services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ANALYTICS_DATABASE_PASSWORD: ${ANALYTICS_DATABASE_PASSWORD:?ANALYTICS_DATABASE_PASSWORD is required}
      TZ: Europe/Paris
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    memswap_limit: 512m
    mem_reservation: 384m
    oom_score_adj: -500
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ${CONTAINER_REGISTRY:?CONTAINER_REGISTRY is required}/rag-ionis-api:${API_IMAGE_TAG:?API_IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      RAG_IONIS_ENV: production
      RAG_IONIS_ENV_FILE_OPTIONAL: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ANALYTICS_DATABASE_URL: postgresql://rag_ionis_analytics:${ANALYTICS_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ANALYTICS_MAX_TOTAL_COST: ${ANALYTICS_MAX_TOTAL_COST:-100000}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?GOOGLE_API_KEY is required}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:?MISTRAL_API_KEY is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      COHERE_API_KEY: ${COHERE_API_KEY:?COHERE_API_KEY is required}
      OPENAI_SERVICE_TIER: ${OPENAI_SERVICE_TIER:-fast}
      PUBLIC_ORIGINS: https://${APP_DOMAIN}
      PHOENIX_ENABLED: "true"
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
      PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-rag-ionis}
      GOLDEN_DATASET_URL: ${GOLDEN_DATASET_URL:-https://docs.google.com/spreadsheets/d/1JtLiCc_nJ7mhCmA_AOgGuRQ0Eu4OFvT07KFsCWhu2DM/edit?gid=1961057140}
      GOLDEN_DATASET_MIN_RECALL: ${GOLDEN_DATASET_MIN_RECALL:-0.85}
    # Seul le Caddy de l'hote (systemd, partage avec les autres sites du VPS) y accede.
    ports:
      - "127.0.0.1:8006:8006"
    mem_limit: 1g
    memswap_limit: 1g
    mem_reservation: 768m
    oom_score_adj: -500
    cpus: 2
    depends_on:
      postgres:
        condition: service_healthy
      phoenix:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  staging-postgres:
    profiles: ["staging"]
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ANALYTICS_DATABASE_PASSWORD: ${ANALYTICS_DATABASE_PASSWORD:?ANALYTICS_DATABASE_PASSWORD is required}
      TZ: Europe/Paris
    command: ["postgres", "-c", "timezone=Europe/Paris"]
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    memswap_limit: 512m
    oom_score_adj: 500
    healthcheck:
      # TCP, not the socket: during first-time init the temporary server listens only on the socket,
      # so a socket check could report healthy before the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  staging-api:
    profiles: ["staging"]
    image: ${CONTAINER_REGISTRY:?CONTAINER_REGISTRY is required}/rag-ionis-api:${STAGING_API_IMAGE_TAG:-${API_IMAGE_TAG:?API_IMAGE_TAG is required}}
    environment:
      RAG_IONIS_ENV: staging
      RAG_IONIS_ENV_FILE_OPTIONAL: "1"
      GOLDEN_DATASET_REQUEST_DELAY_SECONDS: ${GOLDEN_DATASET_REQUEST_DELAY_SECONDS:-10}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@staging-postgres:5432/${POSTGRES_DB}
      ANALYTICS_DATABASE_URL: postgresql://rag_ionis_analytics:${ANALYTICS_DATABASE_PASSWORD}@staging-postgres:5432/${POSTGRES_DB}
      ANALYTICS_MAX_TOTAL_COST: ${ANALYTICS_MAX_TOTAL_COST:-100000}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?GOOGLE_API_KEY is required}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:?MISTRAL_API_KEY is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      COHERE_API_KEY: ${COHERE_API_KEY:?COHERE_API_KEY is required}
      OPENAI_SERVICE_TIER: ${OPENAI_SERVICE_TIER:-fast}
      PHOENIX_ENABLED: "false"
      GOLDEN_DATASET_URL: ${GOLDEN_DATASET_URL:-https://docs.google.com/spreadsheets/d/1JtLiCc_nJ7mhCmA_AOgGuRQ0Eu4OFvT07KFsCWhu2DM/edit?gid=1961057140}
      GOLDEN_DATASET_MIN_RECALL: ${GOLDEN_DATASET_MIN_RECALL:-0.85}
    # Le Caddy de l'hote sert /staging/* ici.
    ports:
      - "127.0.0.1:8007:8006"
    mem_limit: 1g
    memswap_limit: 1g
    oom_score_adj: 500
    cpus: 1
    depends_on:
      staging-postgres:
        condition: service_healthy


  # Commande ponctuelle, absente de `up -d` grace au profil jobs :
  # docker compose ... --profile jobs run --rm updater
  updater:
    profiles: ["jobs"]
    image: ${CONTAINER_REGISTRY:?CONTAINER_REGISTRY is required}/rag-ionis-updater:${UPDATER_IMAGE_TAG:?UPDATER_IMAGE_TAG is required}
    environment:
      RAG_IONIS_ENV: production
      RAG_IONIS_ENV_FILE_OPTIONAL: "1"
      # Pipeline sur le VPS, taches GPU sur Modal (deploy/MODAL.md).
      PIPELINE_EXECUTION_BACKEND: ${PIPELINE_EXECUTION_BACKEND:-modal}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}
      # Tunnel SSH du VPS vers un serveur que YouTube ne bloque pas.
      YT_PROXY: ${YT_PROXY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:?YOUTUBE_API_KEY is required}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
      S3_REGION: ${S3_REGION:?S3_REGION is required}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    # yt-dlp passe par yt-proxy (YT_PROXY=socks5://host.docker.internal:1080).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 1g
    memswap_limit: 1g
    oom_score_adj: 500
    cpus: 1
    depends_on:
      postgres:
        condition: service_healthy
      yt-proxy:
        condition: service_started
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # YouTube bloque l'IP du VPS. Le service yt-tunnel de l'hote (projet
  # agent_mots_cles) ouvre un proxy SOCKS sur 127.0.0.1:1080, que les conteneurs
  # ne voient pas : ce relais le republie sur la passerelle Docker 172.17.0.1
  # (host.docker.internal), jamais sur l'IP publique. Demarre avec l'updater.
  yt-proxy:
    profiles: ["jobs"]
    image: alpine/socat:1.8.0.1@sha256:87d88ff79bf42ca723fb360e9585c40e2923a2f4df9b9d148b127568ef6b99e7
    network_mode: host
    command: ["TCP-LISTEN:1080,bind=172.17.0.1,reuseaddr,fork", "TCP:127.0.0.1:1080"]
    restart: unless-stopped
    mem_limit: 32m
    memswap_limit: 32m
    oom_score_adj: 500
    cpus: 0.25
    logging:
      options:
        max-size: "1m"
        max-file: "2"

  phoenix:
    volumes:
      - phoenix_data:/mnt/data
    mem_limit: 768m
    memswap_limit: 768m
    oom_score_adj: 200
    cpus: 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    name: rag_ionis_postgres_data
  phoenix_data:
    name: rag_ionis_phoenix_data
  staging_postgres_data:
    name: rag_ionis_staging_postgres_data
