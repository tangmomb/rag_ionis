# Services communs au developpement local et a la production.
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    container_name: rag_ionis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_ionis}
      POSTGRES_USER: ${POSTGRES_USER:-rag_ionis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_ionis_dev_password}
      ANALYTICS_DATABASE_PASSWORD: ${ANALYTICS_DATABASE_PASSWORD:-rag_ionis_analytics_dev_password}
      TZ: Europe/Paris
    command: ["postgres", "-c", "timezone=Europe/Paris"]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rag_ionis_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_ionis} -d ${POSTGRES_DB:-rag_ionis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:17.28.0
    container_name: rag_ionis_phoenix
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PHOENIX_PORT:-6006}:6006"
      - "127.0.0.1:${PHOENIX_GRPC_PORT:-4317}:4317"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - rag_ionis_phoenix_data:/mnt/data

volumes:
  rag_ionis_pgdata:
    name: rag_ionis_pgdata
  rag_ionis_phoenix_data:
    name: rag_ionis_phoenix_data
