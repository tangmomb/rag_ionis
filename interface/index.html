<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAG YouTube IONIS-STM</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=10" />
  </head>
  <body>
    <main class="app">
      <section class="workspace">
        <header class="topbar">
          <div
            class="header-thumbnails"
            id="headerThumbnails"
            aria-hidden="true"
          ></div>
          <div class="header-shade" aria-hidden="true"></div>
          <div class="header-card">
            <div class="brand-inline">
              <svg
                class="brand-youtube-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8Z"
                />
                <path
                  class="brand-youtube-play"
                  d="m10 8.6 5.2 3.4-5.2 3.4V8.6Z"
                />
              </svg>
              <div class="brand-copy">
                <div class="brand-kicker">
                  <span></span> IONIS-STM · VIDEO SEARCH
                </div>
                <div class="brand-title">RAG YouTube IONIS-STM</div>
                <div class="brand-subtitle">
                  Posez vos questions sur la chaîne YouTube
                </div>
              </div>
            </div>
            <a
              class="channel-link"
              href="https://www.youtube.com/@IONIS-STM/videos"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Voir la chaîne YouTube IONIS-STM"
            >
              Voir la chaîne
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M7 17 17 7" />
                <path d="M8 7h9v9" />
              </svg>
            </a>
          </div>
        </header>

        <section class="chat" aria-label="Conversation">
          <div class="messages" id="messages"></div>
        </section>

        <form class="composer" id="composer">
          <div class="composer-inner">
            <div
              class="suggested-questions"
              id="suggestedQuestions"
              aria-label="Questions suggérées"
            >
              <div class="suggested-questions-list">
                <button type="button" class="suggested-question">
                  Qui est Aymerich ?
                </button>
                <button type="button" class="suggested-question">
                  J'ai besoin de la transcription d'une vidéo.
                </button>
                <button type="button" class="suggested-question">
                  Quelles questions ont été posées à Fadila ?
                </button>
              </div>
            </div>
            <div class="composer-row">
              <div class="composer-input-shell">
                <textarea
                  id="question"
                  placeholder="Que recherchez vous ?"
                ></textarea>
                <button
                  class="btn btn-primary composer-submit"
                  type="submit"
                  aria-label="Envoyer"
                  title="Envoyer"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M12 17V7" />
                    <path d="m7 12 5-5 5 5" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </form>
      </section>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/markdown-it@15.0.0/dist/browser/markdown-it.umd.min.js"
      integrity="sha384-RFgiWKVXntFwXKC7cM/vTNo+YCPWtoe5WjzaQWX8NMxIt3CnW1Sjhgt6YPVyrGT5"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/dompurify@3.4.13/dist/purify.min.js"
      integrity="sha384-ZuC+DIACqSIZTsp+7YF57cR5Y+6qXa7YFbEKdA/EHA/R0T+41dtorqucYl71Zp+t"
      crossorigin="anonymous"
    ></script>
    <script>
      const messages = document.getElementById("messages");
      const composer = document.getElementById("composer");
      const question = document.getElementById("question");
      const submitButton = composer.querySelector('button[type="submit"]');
      const suggestedQuestionButtons = document.querySelectorAll(".suggested-question");
      const suggestedQuestions = document.getElementById("suggestedQuestions");
      const headerThumbnails = document.getElementById("headerThumbnails");
      let conversationId = null;
      const RAG_CONFIG = {
        apiUrl: "/api/rag",
        embeddingModel: "meme modele que la base",
        rerankModel: "cohere rerank",
        topK: 40,
        finalK: 5,
        useSql: true,
        useRerank: true,
      };

      function setComposerLocked(locked, placeholder = "Que recherchez vous ?") {
        question.disabled = locked;
        submitButton.disabled = locked;
        question.placeholder = placeholder;
        suggestedQuestionButtons.forEach((button) => (button.disabled = locked));
      }

      async function loadHeaderThumbnails() {
        try {
          const response = await fetch("/api/video-thumbnails");
          if (!response.ok) return;
          const thumbnails = await response.json();
          if (!thumbnails.length) return;
          const rowSize = Math.max(12, Math.ceil(thumbnails.length / 2));
          const makeRow = (offset) =>
            Array.from(
              { length: rowSize },
              (_, index) => thumbnails[(index + offset) % thumbnails.length],
            );
          const renderImages = (urls) =>
            urls
              .map(
                (url) =>
                  `<img class="header-thumbnail" src="${escapeHtml(url)}" alt="" />`,
              )
              .join("");

          headerThumbnails.innerHTML = [0, 1]
            .map((rowIndex) => {
              const row = makeRow(rowIndex * rowSize);
              const images = renderImages(row);
              return `<div class="header-thumbnail-row header-thumbnail-row-${rowIndex + 1}">
              <div class="header-thumbnail-track">${images}${images}</div>
            </div>`;
            })
            .join("");
        } catch (_error) {
          // Le header reste utilisable si les miniatures ne sont pas disponibles.
        }
      }

      loadHeaderThumbnails();

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      const markdownRenderer =
        typeof window.markdownit === "function"
          ? window.markdownit({
              html: false,
              linkify: true,
              breaks: false,
            })
          : null;

      if (markdownRenderer) {
        markdownRenderer.renderer.rules.link_open = (
          tokens,
          index,
          options,
          environment,
          renderer,
        ) => {
          const token = tokens[index];
          token.attrSet("target", "_blank");
          token.attrSet("rel", "noreferrer noopener");
          token.attrJoin("class", "external-link-generic");
          if (token.info === "auto" && tokens[index + 1]?.type === "text") {
            tokens[index + 1].content = "Lien";
          }
          return renderer.renderToken(tokens, index, options, environment);
        };
        markdownRenderer.renderer.rules.link_close = () => " ↗</a>";
        markdownRenderer.renderer.rules.table_open = () =>
          '<div class="markdown-table-wrap"><table>\n';
        markdownRenderer.renderer.rules.table_close = () =>
          "</table></div>\n";
      }

      function renderMarkdown(value) {
        const markdown = String(value || "");
        if (!markdownRenderer || !window.DOMPurify) {
          return `<p>${escapeHtml(markdown).replaceAll("\n", "<br>")}</p>`;
        }
        return window.DOMPurify.sanitize(markdownRenderer.render(markdown), {
          USE_PROFILES: { html: true },
          ADD_ATTR: ["target"],
        });
      }

      function renderVideoThumbnails(sources) {
        const videos = [];
        const seen = new Set();

        for (const source of sources) {
          const thumbnailUrl = String(source.thumbnail_medium_url || "").trim();
          const videoUrl = String(source.video_url || "").trim();
          if (
            !/^https?:\/\//i.test(thumbnailUrl) ||
            !/^https?:\/\//i.test(videoUrl) ||
            seen.has(videoUrl)
          )
            continue;
          seen.add(videoUrl);
          videos.push({
            videoUrl,
            thumbnailUrl,
            title: source.video_title || "Vidéo",
          });
        }

        if (!videos.length) return "";

        return `
          <div class="video-carousel" aria-label="Vidéos associées">
            ${videos
              .map(
                (video) => `
                  <article class="video-card">
                    <a class="video-card-link" href="${escapeHtml(video.videoUrl)}" target="_blank" rel="noreferrer noopener">
                      <img src="${escapeHtml(video.thumbnailUrl)}" alt="${escapeHtml(video.title)}" loading="lazy" />
                    <div class="video-title">${escapeHtml(video.title)}</div>
                    </a>
                  </article>`,
              )
              .join("")}
          </div>
        `;
      }

      function addMessage(role, content, meta, sources = [], messageId = null) {
        const article = document.createElement("article");
        article.className = role === "assistant"
          ? "message assistant answer-enter"
          : `message ${role}`;

        const renderedContent =
          role === "assistant" ? renderMarkdown(content) : escapeHtml(content);
        const metaHtml =
          role === "assistant" && meta
            ? `<div class="message-meta"><span>${escapeHtml(meta)}</span></div>`
            : "";
        const videoHtml =
          role === "assistant" ? renderVideoThumbnails(sources) : "";
        const actionsHtml =
          role === "assistant" && Number.isInteger(messageId)
            ? `
              <div class="message-actions">
                <button type="button" class="icon-btn" aria-label="J'aime" data-feedback="true">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M14 10V5.5c0-1.4-.8-2.7-2-3.3L8.7 9.1A2 2 0 0 0 8 10.5V19a2 2 0 0 0 2 2h6.2a3 3 0 0 0 2.9-2.3l1.4-6A2 2 0 0 0 18.6 10H14Z" />
                    <path d="M4 10h4v11H4z" />
                  </svg>
                </button>
                <button type="button" class="icon-btn" aria-label="Je n'aime pas" data-feedback="false">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M10 14v4.5c0 1.4.8 2.7 2 3.3l3.3-6.9a2 2 0 0 0 .7-1.4V5a2 2 0 0 0-2-2H7.8a3 3 0 0 0-2.9 2.3l-1.4 6A2 2 0 0 0 5.4 14H10Z" />
                    <path d="M20 14h-4V3h4z" />
                  </svg>
                </button>
              </div>
            `
            : "";
        article.innerHTML = `
          <div class="message-body">
            ${metaHtml}
            <div class="message-content">${renderedContent}</div>
            ${videoHtml}
            ${actionsHtml}
          </div>
        `;

        if (role === "assistant" && Number.isInteger(messageId)) {
          const feedbackButtons = article.querySelectorAll("[data-feedback]");
          feedbackButtons.forEach((button) => {
            button.addEventListener("click", async () => {
              const feedback = button.dataset.feedback === "true";
              feedbackButtons.forEach((item) => (item.disabled = true));
              try {
                const response = await fetch(
                  `${RAG_CONFIG.apiUrl}/messages/${messageId}/feedback`,
                  {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ feedback }),
                  },
                );
                if (!response.ok) throw new Error("Sauvegarde du feedback impossible.");
                feedbackButtons.forEach((item) => {
                  item.setAttribute("aria-pressed", String(item === button));
                });
              } catch (_error) {
                feedbackButtons.forEach((item) => (item.disabled = false));
              }
            });
          });
        }

        messages.appendChild(article);
        article.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function addLoadingMessage() {
        const article = document.createElement("article");
        article.className = "message assistant loading-message";
        article.innerHTML = `
          <div class="message-body" aria-label="Réponse en cours" role="status">
            <div class="loading-dots" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
          </div>
        `;
        messages.appendChild(article);
        article.scrollIntoView({ behavior: "smooth", block: "start" });
        return article;
      }

      async function sendQuestion(text) {
        const payload = {
          question: text,
          conversationId,
          apiUrl: RAG_CONFIG.apiUrl,
          embeddingModel: RAG_CONFIG.embeddingModel,
          rerankModel: RAG_CONFIG.rerankModel,
          useSql: RAG_CONFIG.useSql,
          useRerank: RAG_CONFIG.useRerank,
          topK: RAG_CONFIG.topK,
          finalK: RAG_CONFIG.finalK,
        };

        suggestedQuestions.hidden = true;
        setComposerLocked(true, "Recherche en cours…");
        addMessage("user", text, "envoi frontend");
        const loadingMessage = addLoadingMessage();

        try {
          const response = await fetch(`${RAG_CONFIG.apiUrl}/stream`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          });
          if (!response.ok) {
            throw new Error(await response.text() || "Erreur backend inconnue");
          }
          if (!response.body) throw new Error("Le navigateur ne supporte pas le streaming.");

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          let rawJson = "";
          let finalResponse = null;
          let finalResponseDisplayed = false;
          let memoryFinished = false;
          const streamingMessage = document.createElement("article");
          streamingMessage.className = "message assistant streaming-json";
          streamingMessage.innerHTML = `
            <div class="message-body">
              <div class="message-meta"><span>stream json</span></div>
              <div class="stream-stage" aria-live="polite"></div>
              <pre class="message-content"></pre>
            </div>`;
          messages.appendChild(streamingMessage);
          const streamOutput = streamingMessage.querySelector("pre");
          const stageOutput = streamingMessage.querySelector(".stream-stage");

          const consumeEvent = (eventText) => {
            const line = eventText.split("\n").find((item) => item.startsWith("data: "));
            if (!line) return;
            const event = JSON.parse(line.slice(6));
            if (event.type === "stage") {
              const stageLabel = `${event.name} · ${event.status}`;
              stageOutput.textContent = stageLabel;
            } else if (event.type === "chunk") {
              rawJson += event.text || "";
              streamOutput.textContent = rawJson;
              streamingMessage.scrollIntoView({ behavior: "smooth", block: "start" });
            } else if (event.type === "done") {
              finalResponse = event.response;
              if (!finalResponseDisplayed) {
                finalResponseDisplayed = true;
                conversationId = finalResponse.conversation_id ?? conversationId;
                streamingMessage.remove();
                const meta = finalResponse.retrieval?.retrieval_mode || "rag";
                addMessage(
                  "assistant",
                  finalResponse.answer || "Réponse vide.",
                  meta,
                  finalResponse.sources || [],
                  finalResponse.message_id,
                );
                loadingMessage.remove();
                setComposerLocked(true, "Mise à jour de la mémoire…");
              }
            } else if (event.type === "memory") {
              memoryFinished = true;
              setComposerLocked(false);
            } else if (event.type === "error") {
              throw new Error(event.detail || "Erreur backend inconnue");
            }
          };

          while (true) {
            const { value, done } = await reader.read();
            buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
            const events = buffer.split("\n\n");
            buffer = events.pop() || "";
            events.forEach(consumeEvent);
            if (done) break;
          }
          if (buffer.trim()) consumeEvent(buffer);
          if (!finalResponse) throw new Error("Réponse stream incomplète.");
          if (!memoryFinished) setComposerLocked(false);
        } catch (error) {
          const message =
            error instanceof Error ? error.message : "Erreur reseau inconnue";
          addMessage(
            "assistant",
            `Le backend a renvoye une erreur.\n\n${message}`,
            "echec requete",
          );
        } finally {
          loadingMessage.remove();
          setComposerLocked(false);
        }
      }

      composer.addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = question.value.trim();
        if (!text) return;
        question.value = "";
        await sendQuestion(text);
      });

      question.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" || event.shiftKey) return;
        event.preventDefault();
        composer.requestSubmit();
      });

      document.querySelectorAll(".suggested-question").forEach((button) => {
        button.addEventListener("click", () => {
          const text = button.textContent.trim();
          if (!text) return;
          question.value = "";
          sendQuestion(text);
        });
      });
    </script>
  </body>
</html>
