<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAG YouTube IONIS-STM</title>
    <link rel="stylesheet" href="styles.css?v=5" />
  </head>
  <body>
    <main class="app">
      <section class="workspace">
        <header class="topbar">
          <div
            class="header-thumbnails"
            id="headerThumbnails"
            aria-hidden="true"
          ></div>
          <div class="header-shade" aria-hidden="true"></div>
          <div class="header-card">
            <div class="brand-inline">
              <svg
                class="brand-youtube-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8Z"
                />
                <path
                  class="brand-youtube-play"
                  d="m10 8.6 5.2 3.4-5.2 3.4V8.6Z"
                />
              </svg>
              <div class="brand-copy">
                <div class="brand-kicker">
                  <span></span> IONIS-STM · VIDEO SEARCH
                </div>
                <div class="brand-title">RAG YouTube IONIS-STM</div>
                <div class="brand-subtitle">
                  Posez vos questions sur la chaîne YouTube
                </div>
              </div>
            </div>
            <a
              class="channel-link"
              href="https://www.youtube.com/@IONIS-STM/videos"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Voir la chaîne YouTube IONIS-STM"
            >
              Voir la chaîne
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M7 17 17 7" />
                <path d="M8 7h9v9" />
              </svg>
            </a>
          </div>
        </header>

        <section class="chat" aria-label="Conversation">
          <div class="messages" id="messages"></div>
        </section>

        <form class="composer" id="composer">
          <div class="composer-inner">
            <div
              class="suggested-questions"
              id="suggestedQuestions"
              aria-label="Questions suggérées"
            >
              <div class="suggested-questions-list">
                <button type="button" class="suggested-question">
                  Qui est Emric ?
                </button>
                <button type="button" class="suggested-question">
                  J'ai besoin de la transcription d'une vidéo ?
                </button>
                <button type="button" class="suggested-question">
                  Quelles questions ont été posées à Déborah ?
                </button>
              </div>
            </div>
            <div class="composer-row">
              <div class="composer-input-shell">
                <textarea
                  id="question"
                  placeholder="Que recherchez vous ?"
                ></textarea>
                <button
                  class="btn btn-primary composer-submit"
                  type="submit"
                  aria-label="Envoyer"
                  title="Envoyer"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M12 17V7" />
                    <path d="m7 12 5-5 5 5" />
                  </svg>
                </button>
              </div>
            </div>
            <div class="composer-actions">
              <div class="composer-hint"></div>
            </div>
          </div>
        </form>
      </section>
    </main>

    <script>
      const messages = document.getElementById("messages");
      const composer = document.getElementById("composer");
      const question = document.getElementById("question");
      const suggestedQuestions = document.getElementById("suggestedQuestions");
      const headerThumbnails = document.getElementById("headerThumbnails");
      let conversationId = null;
      const RAG_CONFIG = {
        apiUrl: "/api/rag",
        answerModel: "gpt-5.6-luna",
        embeddingModel: "meme modele que la base",
        rerankModel: "cohere rerank",
        topK: 40,
        finalK: 5,
        useSql: true,
        useRerank: true,
      };

      async function loadHeaderThumbnails() {
        try {
          const response = await fetch("/api/video-thumbnails");
          if (!response.ok) return;
          const thumbnails = await response.json();
          if (!thumbnails.length) return;
          const rowSize = Math.max(12, Math.ceil(thumbnails.length / 2));
          const makeRow = (offset) =>
            Array.from(
              { length: rowSize },
              (_, index) => thumbnails[(index + offset) % thumbnails.length],
            );
          const renderImages = (urls) =>
            urls
              .map(
                (url) =>
                  `<img class="header-thumbnail" src="${escapeHtml(url)}" alt="" />`,
              )
              .join("");

          headerThumbnails.innerHTML = [0, 1]
            .map((rowIndex) => {
              const row = makeRow(rowIndex * rowSize);
              const images = renderImages(row);
              return `<div class="header-thumbnail-row header-thumbnail-row-${rowIndex + 1}">
              <div class="header-thumbnail-track">${images}${images}</div>
            </div>`;
            })
            .join("");
        } catch (_error) {
          // Le header reste utilisable si les miniatures ne sont pas disponibles.
        }
      }

      loadHeaderThumbnails();

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function renderInlineMarkdown(value) {
        let html = escapeHtml(value);
        const protectedLinks = [];

        function externalLinkContent(url, fallbackLabel = "Lien") {
          if (!/(youtube\.com|youtu\.be|i\.ytimg\.com)/i.test(url)) {
            return `${fallbackLabel} ↗`;
          }

          return `
            Voir sur
            <svg class="youtube-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8Z" />
              <path class="youtube-play" d="m10 8.6 5.2 3.4-5.2 3.4V8.6Z" />
            </svg>
          `
            .replace(/\s+/g, " ")
            .trim();
        }

        html = html.replace(
          /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
          (match, label, url) => {
            const token = `@@EXTERNAL_LINK_${protectedLinks.length}@@`;
            protectedLinks.push(
              `<a href="${url}" target="_blank" rel="noreferrer noopener">${externalLinkContent(url, label)}</a>`,
            );
            return token;
          },
        );

        html = html.replace(/https?:\/\/[^\s<]+/g, (rawUrl) => {
          const trailing = rawUrl.match(/[.,!?;:]+$/)?.[0] || "";
          const url = trailing ? rawUrl.slice(0, -trailing.length) : rawUrl;
          return `<a href="${url}" target="_blank" rel="noreferrer noopener">${externalLinkContent(url, "Lien")}</a>${trailing}`;
        });

        html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
        html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");
        protectedLinks.forEach((link, index) => {
          html = html.replaceAll(`@@EXTERNAL_LINK_${index}@@`, link);
        });
        return html;
      }

      function renderMarkdown(value) {
        const lines = String(value || "")
          .replace(/\r\n/g, "\n")
          .split("\n");
        const parts = [];
        let paragraph = [];
        let listItems = [];
        let codeLines = [];
        let inCodeBlock = false;

        function flushParagraph() {
          if (!paragraph.length) return;
          parts.push(`<p>${renderInlineMarkdown(paragraph.join(" "))}</p>`);
          paragraph = [];
        }

        function flushList() {
          if (!listItems.length) return;
          parts.push(
            `<ul>${listItems.map((item) => `<li>${renderInlineMarkdown(item)}</li>`).join("")}</ul>`,
          );
          listItems = [];
        }

        function flushCodeBlock() {
          if (!codeLines.length) return;
          parts.push(
            `<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`,
          );
          codeLines = [];
        }

        for (const rawLine of lines) {
          const line = rawLine.trimEnd();

          if (line.startsWith("```")) {
            flushParagraph();
            flushList();
            if (inCodeBlock) {
              flushCodeBlock();
              inCodeBlock = false;
            } else {
              inCodeBlock = true;
            }
            continue;
          }

          if (inCodeBlock) {
            codeLines.push(rawLine);
            continue;
          }

          if (!line.trim()) {
            flushParagraph();
            flushList();
            continue;
          }

          const headingMatch = line.match(/^(#{1,3})\s+(.+)$/);
          if (headingMatch) {
            flushParagraph();
            flushList();
            const level = headingMatch[1].length;
            parts.push(
              `<h${level}>${renderInlineMarkdown(headingMatch[2])}</h${level}>`,
            );
            continue;
          }

          const listMatch = line.match(/^[-*]\s+(.+)$/);
          if (listMatch) {
            flushParagraph();
            listItems.push(listMatch[1]);
            continue;
          }

          paragraph.push(line);
        }

        flushParagraph();
        flushList();
        if (inCodeBlock) {
          flushCodeBlock();
        }

        return parts.join("");
      }

      function renderVideoThumbnails(sources) {
        const videos = [];
        const seen = new Set();

        for (const source of sources) {
          const thumbnailUrl = String(source.thumbnail_medium_url || "").trim();
          const videoUrl = String(source.video_url || "").trim();
          if (
            !/^https?:\/\//i.test(thumbnailUrl) ||
            !/^https?:\/\//i.test(videoUrl) ||
            seen.has(videoUrl)
          )
            continue;
          seen.add(videoUrl);
          videos.push({
            videoUrl,
            thumbnailUrl,
            title: source.video_title || "Vidéo",
          });
        }

        if (!videos.length) return "";

        return `
          <div class="video-carousel" aria-label="Vidéos associées">
            ${videos
              .map(
                (video) => `
                  <article class="video-card">
                    <a class="video-card-link" href="${escapeHtml(video.videoUrl)}" target="_blank" rel="noreferrer noopener">
                      <img src="${escapeHtml(video.thumbnailUrl)}" alt="${escapeHtml(video.title)}" loading="lazy" />
                    <div class="video-title">${escapeHtml(video.title)}</div>
                    </a>
                  </article>`,
              )
              .join("")}
          </div>
        `;
      }

      function addMessage(role, content, meta, sources = []) {
        const article = document.createElement("article");
        article.className = `message ${role}`;

        const renderedContent =
          role === "assistant" ? renderMarkdown(content) : escapeHtml(content);
        const metaHtml =
          role === "assistant" && meta
            ? `<div class="message-meta"><span>${escapeHtml(meta)}</span></div>`
            : "";
        const videoHtml =
          role === "assistant" ? renderVideoThumbnails(sources) : "";
        const actionsHtml =
          role === "assistant"
            ? `
              <div class="message-actions" aria-hidden="true">
                <button type="button" class="icon-btn" aria-label="Like">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M14 10V5.5c0-1.4-.8-2.7-2-3.3L8.7 9.1A2 2 0 0 0 8 10.5V19a2 2 0 0 0 2 2h6.2a3 3 0 0 0 2.9-2.3l1.4-6A2 2 0 0 0 18.6 10H14Z" />
                    <path d="M4 10h4v11H4z" />
                  </svg>
                </button>
                <button type="button" class="icon-btn" aria-label="Dislike">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M10 14v4.5c0 1.4.8 2.7 2 3.3l3.3-6.9a2 2 0 0 0 .7-1.4V5a2 2 0 0 0-2-2H7.8a3 3 0 0 0-2.9 2.3l-1.4 6A2 2 0 0 0 5.4 14H10Z" />
                    <path d="M20 14h-4V3h4z" />
                  </svg>
                </button>
              </div>
            `
            : "";
        article.innerHTML = `
          <div class="message-body">
            ${metaHtml}
            <div class="message-content">${renderedContent}</div>
            ${videoHtml}
            ${actionsHtml}
          </div>
        `;

        messages.appendChild(article);
        article.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function addLoadingMessage() {
        const article = document.createElement("article");
        article.className = "message assistant loading-message";
        article.innerHTML = `
          <div class="message-body" aria-label="Réponse en cours" role="status">
            <div class="loading-dots" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
          </div>
        `;
        messages.appendChild(article);
        article.scrollIntoView({ behavior: "smooth", block: "start" });
        return article;
      }

      async function sendQuestion(text) {
        const payload = {
          question: text,
          conversationId,
          apiUrl: RAG_CONFIG.apiUrl,
          answerModel: RAG_CONFIG.answerModel,
          embeddingModel: RAG_CONFIG.embeddingModel,
          rerankModel: RAG_CONFIG.rerankModel,
          useSql: RAG_CONFIG.useSql,
          useRerank: RAG_CONFIG.useRerank,
          topK: RAG_CONFIG.topK,
          finalK: RAG_CONFIG.finalK,
        };

        suggestedQuestions.hidden = true;
        addMessage("user", text, "envoi frontend");
        const loadingMessage = addLoadingMessage();

        try {
          const response = await fetch(RAG_CONFIG.apiUrl, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.detail || "Erreur backend inconnue");
          }

          conversationId = data.conversation_id ?? conversationId;
          const meta = data.retrieval?.retrieval_mode || "rag";
          addMessage(
            "assistant",
            data.answer || "Reponse vide.",
            meta,
            data.sources || [],
          );
        } catch (error) {
          const message =
            error instanceof Error ? error.message : "Erreur reseau inconnue";
          addMessage(
            "assistant",
            `Le backend a renvoye une erreur.\n\n${message}`,
            "echec requete",
          );
        } finally {
          loadingMessage.remove();
        }
      }

      composer.addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = question.value.trim();
        if (!text) return;
        question.value = "";
        await sendQuestion(text);
      });

      question.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" || event.shiftKey) return;
        event.preventDefault();
        composer.requestSubmit();
      });

      document.querySelectorAll(".suggested-question").forEach((button) => {
        button.addEventListener("click", () => {
          const text = button.textContent.trim();
          if (!text) return;
          question.value = "";
          sendQuestion(text);
        });
      });
    </script>
  </body>
</html>
