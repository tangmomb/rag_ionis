<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Documentation interactive du pipeline qui transforme une vidéo en transcripts, speakers et chunks."
    >
    <title>De la vidéo aux données — pipeline détaillé</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <div class="tree-heading">
        <div>
          <span class="section-index">Pipeline vidéo · Explorateur</span>
          <h2>Chemin d’exécution</h2>
          <p class="manifest-note">
            Le manifeste vidéo est mis à jour tout au long du pipeline.
          </p>
        </div>
      </div>
      <div id="pipeline-tree" class="tree" tabindex="0" role="region" aria-label="Étapes du pipeline, défilement horizontal"></div>
      <nav class="pipeline-navigation" aria-label="Navigation du pipeline">
        <div class="navigation-status">
          <span class="section-index">Parcours actif</span>
          <span id="step-position" aria-live="polite"></span>
        </div>
        <div id="step-navigation" class="step-navigation" aria-label="Aller à une étape"></div>
        <div class="navigation-arrows">
          <button id="previous-step" type="button" aria-label="Étape précédente">←</button>
          <button id="next-step" type="button" aria-label="Étape suivante">→</button>
        </div>
      </nav>
    </main>
  </body>
</html>
