<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vidéos · RAG IONIS</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="video-page">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span><div><strong>RAG IONIS</strong><small>Explorateur vidéo</small></div></div>
    <a class="mode-link active" href="/videos">▣ Explorer les vidéos</a>
    <a class="mode-link" href="/">▤ Explorer PostgreSQL</a>
    <div class="connection"><span id="healthDot" class="health-dot online"></span><span id="healthText">Indexation locale</span></div>
    <label class="side-label" for="videoFilter">VIDÉOS</label>
    <input id="videoFilter" class="filter" placeholder="Titre ou identifiant…" autocomplete="off">
    <nav id="videoList" class="table-list"></nav>
  </aside>
  <main>
    <header class="topbar">
      <div><p class="eyebrow">SORTIES DU PIPELINE</p><h1 id="title">Sélectionnez une vidéo</h1></div>
      <button id="refresh" class="button secondary">↻ Actualiser</button>
    </header>
    <section id="empty" class="empty"><div class="empty-icon">▶</div><h2>Explorez les données produites</h2><p>Choisissez une vidéo à gauche pour consulter son résumé, son transcript, l’OCR, les images et les chunks.</p></section>
    <section id="content" class="video-content hidden">
      <section class="video-overview">
        <div id="preview" class="video-preview"></div>
        <div class="video-intro">
          <div id="videoBadges" class="badges"></div>
          <p id="videoMeta" class="video-meta"></p>
          <a id="youtubeLink" class="button secondary inline-button" target="_blank" rel="noreferrer">Voir sur YouTube ↗</a>
        </div>
        <div id="stats" class="video-stats"></div>
      </section>
      <nav id="tabs" class="tabs" aria-label="Données de la vidéo">
        <button class="tab active" data-tab="summary">Résumé</button>
        <button class="tab" data-tab="transcript">Transcript</button>
        <button class="tab" data-tab="ocr">OCR</button>
        <button class="tab" data-tab="images">Images</button>
        <button class="tab" data-tab="chunks">Chunks</button>
        <button class="tab" data-tab="files">Fichiers</button>
      </nav>
      <section id="panel-summary" class="data-panel"></section>
      <section id="panel-transcript" class="data-panel hidden"></section>
      <section id="panel-ocr" class="data-panel hidden"></section>
      <section id="panel-images" class="data-panel hidden"></section>
      <section id="panel-chunks" class="data-panel hidden"></section>
      <section id="panel-files" class="data-panel hidden"></section>
    </section>
  </main>
  <script src="/static/videos.js"></script>
</body>
</html>
